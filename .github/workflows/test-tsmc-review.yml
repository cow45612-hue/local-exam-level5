name: Verify TSMC 30-Question Review

on:
  pull_request:
    paths:
      - "tsmc-review.js"
      - "scripts/test_tsmc_review.cjs"
      - "app.js"
      - "index.html"
      - "style.css"
      - ".github/workflows/test-tsmc-review.yml"
  push:
    paths:
      - "tsmc-review.js"
      - "scripts/test_tsmc_review.cjs"
      - "app.js"
      - "index.html"
      - "style.css"
      - ".github/workflows/test-tsmc-review.yml"

permissions:
  contents: read

jobs:
  review-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Syntax checks
        run: |
          node --check app.js
          node --check tsmc-review.js
          node --check scripts/test_tsmc_review.cjs
      - name: Verify 288-word coverage and persistence
        run: node scripts/test_tsmc_review.cjs
