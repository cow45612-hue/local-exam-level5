<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>地方特考五等免費刷題 App</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <p class="label">免費刷題 App</p>
        <h1>地方特考五等</h1>
        <p class="subtitle">選科目、隨機 20 題、送出後自動批改，錯題會自動保存。</p>
      </header>

      <section id="setup-view" class="screen">
        <label class="field">
          <span>選擇科目</span>
          <select id="subject-select"></select>
        </label>

        <div class="button-grid">
          <button id="start-random" class="primary">隨機練習 20 題</button>
          <button id="start-wrong">重練錯題</button>
        </div>

        <p id="wrong-count" class="hint">錯題：0 題</p>
        <p id="load-message" class="message" hidden></p>
      </section>

      <section id="quiz-view" class="screen" hidden>
        <div class="quiz-bar">
          <div>
            <strong id="quiz-title">練習中</strong>
            <span id="progress-text">第 1 / 20 題</span>
          </div>
          <button id="back-home" class="ghost">返回</button>
        </div>

        <article class="question-card">
          <p id="subject-badge" class="badge">科目</p>
          <h2 id="question-text"></h2>
          <div id="options" class="options"></div>
        </article>

        <div class="nav-row">
          <button id="prev-question">上一題</button>
          <button id="next-question">下一題</button>
        </div>

        <button id="submit-quiz" class="primary full">送出並批改</button>
      </section>

      <section id="result-view" class="screen" hidden>
        <div class="result-card">
          <p class="label">本次成績</p>
          <strong id="score-rate">0%</strong>
          <p id="score-detail">答對 0 / 0 題</p>
        </div>

        <div class="button-grid">
          <button id="retry-same" class="primary">重新練習本次題目</button>
          <button id="result-home">回首頁</button>
        </div>

        <section class="review-section">
          <h2>每題解析</h2>
          <div id="review-list"></div>
        </section>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
